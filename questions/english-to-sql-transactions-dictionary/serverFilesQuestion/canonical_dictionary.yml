version: 4
implementation: dictionary-plus-llm
stage: 1-of-2-llm-mapping
description: Map explicitly stated student wording to instructor-authored canonical phrases before SQL generation.

runtime:
  type: grounded_llm_dictionary_mapping
  model_call: true
  mapping:
    examples_allow_clear_paraphrases: true
    preserve_unmatched_text: true
    preserve_matched_arguments: true
    require_exact_source_evidence: true
    require_non_overlapping_source_order: true
    do_not_map_inside_quoted_values: true
    require_at_least_one_operation_match: true

normalizations:
  - canonical: use table
    kind: operation
    phrases:
      - start with the table
      - start with table
      - use the table
      - use table

  - canonical: select
    kind: operation
    phrases:
      - return the columns
      - return columns
      - select the columns
      - select columns
      - select

  - canonical: select distinct
    kind: operation
    phrases:
      - select unique
      - return unique
      - select distinct

  - canonical: filter rows where
    kind: operation
    phrases:
      - keep only rows where
      - keep rows where
      - filter rows where

  - canonical: filter where
    kind: operation
    phrases:
      - filter again for
      - filter for

  - canonical: group rows by
    kind: operation
    phrases:
      - group the rows by
      - group rows by
      - group by
      - for each unique
      - for each

  - canonical: join
    kind: operation
    phrases:
      - combine the tables where
      - combine tables where
      - join the tables on
      - join tables on
      - combine
      - join

  - canonical: compute count distinct of
    kind: operation
    phrases:
      - count the distinct
      - count distinct
      - compute count distinct of

  - canonical: compute count of
    kind: operation
    phrases:
      - count the number of
      - compute the count of
      - compute count of

  - canonical: compute sum of
    kind: operation
    phrases:
      - calculate the sum of
      - compute the sum of
      - compute sum of
      - sum their
      - sum the

  - canonical: compute average of
    kind: operation
    phrases:
      - calculate the average of
      - compute the average of
      - compute average of

  - canonical: compute minimum of
    kind: operation
    phrases:
      - calculate the minimum of
      - compute the minimum of
      - compute minimum of

  - canonical: compute maximum of
    kind: operation
    phrases:
      - calculate the maximum of
      - compute the maximum of
      - compute maximum of

  - canonical: keep groups where
    kind: operation
    phrases:
      - keep only groups where
      - keep groups where
      - filter groups where

  - canonical: aggregate the result with
    kind: operation
    phrases:
      - aggregate the result with
      - summarize the result with

  - canonical: order by
    kind: operation
    phrases:
      - sort the rows by
      - sort rows by
      - order by

  - canonical: ascending
    kind: modifier
    phrases:
      - from smallest to largest
      - in increasing order
      - ascending

  - canonical: descending
    kind: modifier
    phrases:
      - from largest to smallest
      - in decreasing order
      - descending

  - canonical: greater than or equal to
    kind: modifier
    phrases:
      - no less than
      - at least
      - greater than or equal to

  - canonical: less than or equal to
    kind: modifier
    phrases:
      - no more than
      - at most
      - less than or equal to

  - canonical: greater than
    kind: modifier
    phrases:
      - more than
      - greater than

  - canonical: less than
    kind: modifier
    phrases:
      - fewer than
      - less than

  - canonical: equal to
    kind: modifier
    phrases:
      - exactly equal to
      - equals
      - equal to

  - canonical: not equal to
    kind: modifier
    phrases:
      - does not equal
      - not equal to

  - canonical: keep filtered rows
    kind: modifier
    phrases:
      - keep those rows only
      - keep those rows

  - canonical: keep the first
    kind: operation
    phrases:
      - limit the result to
      - keep the first

  - canonical: skip the first
    kind: operation
    phrases:
      - offset by
      - skip the first

non_inference_rules:
  - Never insert a canonical phrase without explicit supporting wording in the student plan.
  - Treat listed phrases as instructor examples; map a clear ordinary-English paraphrase only when its meaning is unambiguous.
  - Never map a table or column name to an operation.
  - Never map the word total by itself to SUM because total may be a column name.
  - Never choose a table, column, function, comparison, grouping, or sort direction.
  - Cite the smallest exact substring that expresses each mapping so arguments remain unchanged.
  - Return mappings in source order without overlaps.
  - At least one operation must be mapped or the plan is rejected before the SQL-generation call.
  - Preserve unmatched prose only as possible arguments or connectors. Unmatched prose cannot create an operation.
  - Code-like spellings such as groupby, more_than, and df[...] are not canonical English and must not be interpreted as operations.

output:
  format: json
  schema:
    mappings:
      - original: exact supporting substring from the student plan
        canonical: replacement phrase
