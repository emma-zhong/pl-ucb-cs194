# How to turn the normalized student plan into SQLite.

goal: Translate only the operations the student actually wrote. Keep their logic and mistakes.

rules:
  - Use recognized_operations as the complete list of allowed SQL operations.
  - Use recognized_modifiers as the complete list of allowed word-based comparisons, sort directions, and confirmations.
  - Unmatched text may name tables, columns, values, or connect ideas. It may not add an operation or modifier.
  - The symbols ==, =, !=, <>, >, >=, <, and <= may be used as comparisons even when they are not in recognized_modifiers.
  - Copy every table, column, alias, and other SQL expression the student explicitly names, even if it is misspelled, unknown, or ambiguous in database_schema.
  - Do not correct, qualify, replace, or infer an intended identifier. For example, if the student writes id, use id even when several tables have an id column.
  - An explicit but invalid identifier is still a supplied detail. Generate the SQL and let SQLite or the autograder report the error.
  - Add FROM only when the student explicitly names a table. Do not add the sole schema table as a default.
  - With multiple tables, use only named_tables.
  - Never invent a join. A join needs the join operation, all table names, and the matching columns.
  - Always return best-effort SQL. Never return a plan error because a detail is missing, invalid, unsupported, or ambiguous.
  - Compile every recognized operation as far as the student's details allow. If a clause or expression cannot be written without guessing, omit only that part and continue with the rest of the query.
  - Do not add a filter, group, aggregate, DISTINCT, subquery, sort, limit, or offset to improve the answer.
  - SQL clauses may be reordered when SQLite requires it. For example, an ordinary column filter uses WHERE even if it appears after grouping in the plan.
  - Use a subquery only when the student explicitly asks to aggregate a result.

operations:
  use table:
    write: FROM followed by the explicitly named table
    if incomplete: omit FROM
  select:
    write: SELECT followed by every explicitly named column or computed result
  select distinct:
    write: SELECT DISTINCT followed by every explicitly named column
  filter rows where:
    write: WHERE using the supplied column, comparison, and value
    if incomplete: omit this filter
  filter where:
    write: WHERE for a supplied column target or HAVING for a supplied aggregate target
    if incomplete: omit this filter
  group rows by:
    write: GROUP BY followed by every supplied grouping column
    if incomplete: omit GROUP BY
  join:
    write: JOIN every explicitly named table and add ON only when matching columns are supplied
  compute count distinct of:
    write: COUNT(DISTINCT input) when an input is supplied
  compute count of:
    write: COUNT(input) when an input is supplied
  compute sum of:
    write: SUM(input) when an input is supplied
  compute average of:
    write: AVG(input) when an input is supplied
  compute minimum of:
    write: MIN(input) when an input is supplied
  compute maximum of:
    write: MAX(input) when an input is supplied
  keep groups where:
    write: HAVING using the supplied aggregate or alias, comparison, and value
    if incomplete: omit HAVING
  aggregate the result with:
    write: an outer query using the supplied aggregate function and input
    if incomplete: omit the outer aggregate and keep the inner query
  order by:
    write: ORDER BY using the supplied expression and direction
    if incomplete: omit ORDER BY
  keep the first:
    write: LIMIT followed by the supplied row count
    if incomplete: omit LIMIT
  skip the first:
    write: OFFSET followed by the supplied row count
    if incomplete: omit OFFSET

interpretation:
  - A comparison against an aggregate is a group filter. A comparison against a regular column is a row filter.
  - Copy values and comparison directions exactly. Treat == as equality and $100 as the number 100.
  - Treat "total dollar amount" as the total column because it is the only direct schema match.
  - '"For each X" and "for each unique X" mean group by every named X column. Here, "unique" does not also request SELECT DISTINCT.'
  - '"Keep filtered rows" confirms the preceding filter; it is not a new SQL operation.'

default_select:
  - If the student does not give a SELECT list, select the grouping columns followed by the requested aggregates.
  - If there is grouping but no aggregate, select the grouping columns.
  - "Otherwise, select *."
  - These defaults may not add DISTINCT, an aggregate, a grouping column, a predicate, or an outer aggregation.

output:
  - Return exactly one best-effort SQLite SELECT or WITH statement ending in a semicolon.
  - The statement does not need to execute successfully. Preserve student errors for SQLite or the autograder to catch.
  - Never return PLAN_ERROR or ask for more detail.
  - Return no Markdown, comments, labels, explanations, alternatives, or second statement.
  - Never use INSERT, UPDATE, DELETE, REPLACE, DROP, ALTER, CREATE, PRAGMA, ATTACH, DETACH, or VACUUM.
