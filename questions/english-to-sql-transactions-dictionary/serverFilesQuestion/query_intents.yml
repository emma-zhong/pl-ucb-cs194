# How to turn the normalized student plan into SQLite.

goal: Translate only the operations the student actually wrote. Keep their logic and mistakes.

rules:
  - Use recognized_operations as the complete list of allowed SQL operations.
  - Use recognized_modifiers as the complete list of allowed word-based comparisons, sort directions, and confirmations.
  - Unmatched text may name tables, columns, values, or connect ideas. It may not add an operation or modifier.
  - The symbols ==, =, !=, <>, >, >=, <, and <= may be used as comparisons even when they are not in recognized_modifiers.
  - Copy every table, column, alias, and other SQL expression the student explicitly names, even if it is misspelled, unknown, or ambiguous in database_schema.
  - Do not correct, qualify, replace, or infer an intended identifier. For example, if the student writes id, use id even when several tables have an id column.
  - An explicit but invalid identifier is still a supplied detail. Generate the SQL and let SQLite or the autograder report the error.
  - With one table, use it in FROM if the student does not name it. With multiple tables, use only named_tables.
  - Never invent a join. A join needs the join operation, all table names, and the matching columns.
  - Compile every recognized operation. If it is missing a required detail, return the matching PLAN_ERROR instead of skipping it.
  - Do not add a filter, group, aggregate, DISTINCT, subquery, sort, limit, or offset to improve the answer.
  - SQL clauses may be reordered when SQLite requires it. For example, an ordinary column filter uses WHERE even if it appears after grouping in the plan.
  - Use a subquery only when the student explicitly asks to aggregate a result.

operations:
  use table:
    needs: a table name, unless database_schema has exactly one table
    error: MISSING_TABLE
  select:
    needs: at least one column or computed result
    error: MISSING_COLUMN
  select distinct:
    needs: at least one column
    error: MISSING_COLUMN
  filter rows where:
    needs: a column, comparison, and value
    missing: {column: MISSING_COLUMN, comparison: MISSING_COMPARISON, value: MISSING_VALUE}
  filter where:
    needs: a column or aggregate, comparison, and value
    missing: {target: MISSING_COLUMN, comparison: MISSING_COMPARISON, value: MISSING_VALUE}
    note: Use WHERE for a column and HAVING for an aggregate.
  group rows by:
    needs: a grouping column
    error: MISSING_GROUP_COLUMN
  join:
    needs: every table and the columns that match
    missing: {table: MISSING_TABLE, matching columns: MISSING_JOIN_CONDITION}
  compute count distinct of:
    needs: an input column or rows
    error: MISSING_AGGREGATE_INPUT
  compute count of:
    needs: an input column or rows
    error: MISSING_AGGREGATE_INPUT
  compute sum of:
    needs: an input column
    error: MISSING_AGGREGATE_INPUT
  compute average of:
    needs: an input column
    error: MISSING_AGGREGATE_INPUT
  compute minimum of:
    needs: an input column
    error: MISSING_AGGREGATE_INPUT
  compute maximum of:
    needs: an input column
    error: MISSING_AGGREGATE_INPUT
  keep groups where:
    needs: an aggregate or its alias, comparison, and value
    missing: {aggregate: MISSING_AGGREGATE_INPUT, comparison: MISSING_COMPARISON, value: MISSING_VALUE}
  aggregate the result with:
    needs: a supported aggregate and its input
    missing: {function: MISSING_AGGREGATE_FUNCTION, input: MISSING_AGGREGATE_INPUT}
  order by:
    needs: a column or computed value, plus ascending or descending
    missing: {expression: MISSING_SORT_EXPRESSION, direction: MISSING_SORT_DIRECTION}
  keep the first:
    needs: a nonnegative row count
    error: MISSING_ROW_COUNT
  skip the first:
    needs: a nonnegative row count
    error: MISSING_ROW_COUNT

interpretation:
  - A comparison against an aggregate is a group filter. A comparison against a regular column is a row filter.
  - Copy values and comparison directions exactly. Treat == as equality and $100 as the number 100.
  - Treat "total dollar amount" as the total column because it is the only direct schema match.
  - '"For each X" and "for each unique X" mean group by every named X column. Here, "unique" does not also request SELECT DISTINCT.'
  - '"Keep filtered rows" confirms the preceding filter; it is not a new SQL operation.'

default_select:
  - If the student does not give a SELECT list, select the grouping columns followed by the requested aggregates.
  - If there is grouping but no aggregate, select the grouping columns.
  - "Otherwise, select *."
  - These defaults may not add DISTINCT, an aggregate, a grouping column, a predicate, or an outer aggregation.

errors:
  format: PLAN_ERROR:<REASON>
  allowed_reasons:
    - MISSING_TABLE
    - MISSING_COLUMN
    - MISSING_COMPARISON
    - MISSING_VALUE
    - MISSING_GROUP_COLUMN
    - MISSING_AGGREGATE_FUNCTION
    - MISSING_AGGREGATE_INPUT
    - MISSING_SORT_EXPRESSION
    - MISSING_SORT_DIRECTION
    - MISSING_ROW_COUNT
    - MISSING_JOIN_CONDITION
    - AMBIGUOUS_DETAIL
    - UNSUPPORTED_OPERATION
  rules:
    - Use the most specific reason for the earliest incomplete operation.
    - Use a missing-detail error only when the student did not supply that detail at all. Do not use it for an explicit but invalid detail.
    - Use AMBIGUOUS_DETAIL only when the student's wording does not provide one concrete expression to copy. A concrete but schema-ambiguous name such as id is not a reason to return this error.
    - Use UNSUPPORTED_OPERATION when unmatched wording, code, or shorthand appears to request another operation.
    - Never fill in a missing detail from the schema or a guessed assignment.

output:
  - Return exactly one complete SQLite SELECT or WITH statement ending in a semicolon.
  - The statement must be syntactically complete, but it does not need to execute successfully. Preserve explicit student errors for SQLite or the autograder to catch.
  - If the plan cannot be translated, return exactly one allowed PLAN_ERROR value.
  - Return no Markdown, comments, labels, explanations, alternatives, or second statement.
  - Never use INSERT, UPDATE, DELETE, REPLACE, DROP, ALTER, CREATE, PRAGMA, ATTACH, DETACH, or VACUUM.
