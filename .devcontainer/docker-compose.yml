services:
  prairielearn:
    image: prairielearn/prairielearn:latest
    platform: linux/amd64
    environment:
      HOST_JOBS_DIR: /tmp/dir-for-ag-jobqueue
      PL_CONFIG_PATH: /course/.devcontainer/prairielearn-config.json
      # SQL generation goes through the proxy (proxy/README.md); the OpenAI key lives there.
      ENGLISH_TO_SQL_PROXY_URL: ${ENGLISH_TO_SQL_PROXY_URL:-http://host.docker.internal:8787}
      ENGLISH_TO_SQL_PROXY_TOKEN: ${ENGLISH_TO_SQL_PROXY_TOKEN:?Set ENGLISH_TO_SQL_PROXY_TOKEN to the proxy's COURSE_TOKEN}
      ENGLISH_TO_SQL_MODEL: ${ENGLISH_TO_SQL_MODEL:-gpt-4.1-mini}
    ports:
      - 3000:3000
    volumes:
      - /tmp/dir-for-ag-jobqueue:/jobs
      - ..:/course
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  devcontainer:
    image: mcr.microsoft.com/devcontainers/universal
    platform: linux/amd64
    links:
      - prairielearn
    volumes: # Mount the root folder that contains .git
      - ..:/workspaces/pl-ucb-csxxx:rw
